<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">复利 CI — 游戏化 AI 学习日程</title>
  <desc id="desc">米色纸面背景上的项目标题与手绘八角星，星周环绕 CI 币、经验和连击的游戏化反馈。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EC"/>
      <stop offset="1" stop-color="#F3EEE0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#paper)"/>
  <rect x="1.5" y="1.5" width="1197" height="377" rx="24.5" fill="none" stroke="#D4CAB7" stroke-width="2"/>

  <!-- ===== title block ===== -->
  <g id="title-block" transform="translate(72 78)">
    <text x="2" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="4" fill="#6A7B61">ANDROID · 本地优先 · 游戏化学习</text>

    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="76" font-weight="700" fill="#31332C">复利 <tspan fill="#6A7B61">CI</tspan></text>

    <!-- hand-drawn gold underline -->
    <path d="M 4 112 C 80 104, 170 118, 260 110 S 340 106, 372 111"
          fill="none" stroke="#B18449" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <text x="2" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="23" fill="#31332C">把学习变成可持续积累、即时获得回报的复利游戏</text>
    <text x="2" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="19" fill="#606257">AI 排程 · 专注计时 · CI 币经济 · 数据复盘，一台平板上的完整学习工作流</text>

    <text x="2" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16.5" fill="#8B8B7D">v0.3.0  ·  Kotlin 2.1  ·  Compose  ·  Room  ·  MNN  ·  minSdk 31  ·  arm64-v8a</text>
  </g>

  <!-- ===== hand-drawn compass star with gamified orbit ===== -->
  <g id="star-proof" transform="translate(948 182)">
    <!-- dashed orbit -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="#D4CAB7" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round"/>

    <!-- long 4-point star, sketchy double stroke -->
    <g fill="none" stroke="#31332C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -96 L 12 -13 L 96 0 L 12 13 L 0 96 L -12 13 L -96 0 L -12 -13 Z"/>
      <path d="M 0 -56 L 8 -8 L 56 0 L 8 8 L 0 56 L -8 8 L -56 0 L -8 -8 Z"
            transform="rotate(45)" stroke-width="3.5"/>
    </g>
    <!-- offset sketch echo -->
    <path d="M 2 -94 L 14 -12 L 97 2 L 14 15 L 2 97 L -10 15 L -94 2 L -10 -12 Z"
          fill="none" stroke="#8B8B7D" stroke-width="1.8" stroke-linejoin="round" opacity="0.55"/>

    <!-- orbiting dots -->
    <circle cx="-101" cy="-101" r="7" fill="#6C8584"/>
    <circle cx="118" cy="-79" r="5.5" fill="#B18449"/>
    <circle cx="60" cy="129" r="6.5" fill="#6A7B61"/>
    <circle cx="-131" cy="55" r="4.5" fill="#B18449"/>

    <!-- reward chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">
      <g transform="translate(72 -148)">
        <rect x="0" y="0" width="104" height="38" rx="19" fill="#F2E3C4" stroke="#B18449" stroke-width="2"/>
        <text x="52" y="25" text-anchor="middle" fill="#7A5A2B">+30 CI</text>
      </g>
      <g transform="translate(-196 96)">
        <rect x="0" y="0" width="112" height="38" rx="19" fill="#E8ECE2" stroke="#6A7B61" stroke-width="2"/>
        <text x="56" y="25" text-anchor="middle" fill="#4A5844">经验 +48</text>
      </g>
      <g transform="translate(96 108)">
        <rect x="0" y="0" width="112" height="38" rx="19" fill="#DCE7E4" stroke="#6C8584" stroke-width="2"/>
        <text x="56" y="25" text-anchor="middle" fill="#42585A">连击 ×7</text>
      </g>
    </g>
  </g>
</svg>
